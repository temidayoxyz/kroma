<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F2EFE6"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C9C3B4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Technical frame -->
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#1A1813" stroke-width="2"/>
  <line x1="50" y1="110" x2="1150" y2="110" stroke="#1A1813" stroke-width="1.5"/>

  <!-- Header meta -->
  <text x="80" y="88" font-family="'Courier New', monospace" font-size="16" fill="#E0452B" letter-spacing="6">KROMA SOUND LABORATORIES // ZURICH</text>
  <text x="1120" y="88" text-anchor="end" font-family="'Courier New', monospace" font-size="14" fill="#8A8475" letter-spacing="2">CATALOGUE 2026</text>

  <!-- Brand mark: dial -->
  <circle cx="150" cy="330" r="52" stroke="#1A1813" stroke-width="4" fill="none"/>
  <line x1="150" y1="245" x2="150" y2="272" stroke="#E0452B" stroke-width="5"/>
  <circle cx="150" cy="330" r="16" fill="#E0452B"/>

  <!-- Title -->
  <text x="250" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="900" fill="#1A1813" letter-spacing="6">KROMA</text>
  <text x="250" y="415" font-family="'Courier New', monospace" font-size="24" fill="#E0452B" letter-spacing="4">PRECISION ANALOG INSTRUMENTS</text>

  <!-- Description -->
  <text x="80" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#4A463C" letter-spacing="1">Discrete synthesizers, vacuum-tube preamps &amp; mastering hardware.</text>
  <text x="80" y="530" font-family="'Courier New', monospace" font-size="15" fill="#8A8475" letter-spacing="2">THD+N &lt; 0.0003% · 100% DISCRETE TOPOLOGY · BUILT IN SWITZERLAND</text>

  <!-- Red corner blocks -->
  <rect x="50" y="50" width="14" height="14" fill="#E0452B"/>
  <rect x="1136" y="50" width="14" height="14" fill="#E0452B"/>
  <rect x="50" y="566" width="14" height="14" fill="#E0452B"/>
  <rect x="1136" y="566" width="14" height="14" fill="#E0452B"/>
</svg>
